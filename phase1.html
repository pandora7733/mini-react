<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Diff 검증 페이지</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <a class="back-link" href="./index.html">mini-react</a>
        <h1>Diff 검증 페이지</h1>
        <p>테스트 영역을 고치고 Patch를 누르면, 이전 Virtual DOM과 비교해 바뀐 부분만 실제 영역에 반영합니다.</p>
      </header>

      <div class="toolbar">
        <button id="patch-btn" class="primary" type="button">Patch</button>
        <button id="back-btn" type="button">뒤로가기</button>
        <button id="forward-btn" type="button">앞으로가기</button>
        <span id="status" class="status" role="status"></span>
      </div>

      <div class="columns">
        <section class="panel">
          <h2>실제 영역</h2>
          <!-- 공백 텍스트도 노드로 변환된다. 공백에는 key가 없어 인덱스로 비교되므로 li 사이는 붙여 둔다 -->
          <div id="real-area" class="area" inert>
            <article class="note" style="border-left: 4px solid #2f6f6d; padding-left: 12px">
              <h3>오늘의 할 일</h3>
              <p>Virtual DOM은 <strong>실제 DOM의 가벼운 복사본</strong>입니다.</p>
              <ul><li data-key="a">Diff 알고리즘 구현</li><li data-key="b">Patch 구현</li><li data-key="c">State History 구현</li></ul>
              <label><input type="checkbox" checked /> 완료 표시</label>
              <p><input type="text" value="입력값도 비교합니다" /></p>
            </article>
          </div>
        </section>

        <section class="panel">
          <h2>테스트 영역</h2>
          <div id="test-area" class="area editable" contenteditable="true" spellcheck="false"></div>
          <label class="field-label" for="source">HTML 코드</label>
          <textarea id="source" class="source" rows="12" spellcheck="false"></textarea>
          <div class="scenarios">
            <span class="field-label">변경 예시</span>
            <button type="button" data-scenario="text">텍스트</button>
            <button type="button" data-scenario="attr">속성</button>
            <button type="button" data-scenario="add">추가</button>
            <button type="button" data-scenario="remove">삭제</button>
            <button type="button" data-scenario="replace">교체</button>
            <button type="button" data-scenario="move">key 이동</button>
          </div>
        </section>
      </div>

      <div class="columns">
        <section class="panel">
          <h2>마지막 변경 내역</h2>
          <p id="metric" class="metric"></p>
          <ol id="change-log" class="change-log"></ol>
        </section>

        <section class="panel">
          <h2>State History</h2>
          <ol id="history-list" class="history-list"></ol>
          <details class="vdom-details">
            <summary>현재 Virtual DOM 보기</summary>
            <pre id="vdom-view" class="vdom-view"></pre>
          </details>
        </section>
      </div>
    </main>
    <script type="module" src="./dist/pages/phase1.js"></script>
  </body>
</html>
